spring.application.name=restaurante

# Banco — valores default servem para desenvolvimento local. Em produção, defina as
# variáveis de ambiente. NÃO coloque segredo real neste arquivo (ele vai para o git).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurante}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT — em produção defina JWT_SECRET com >= 32 bytes. Sem ele, um segredo efêmero
# é gerado na inicialização (os tokens deixam de valer a cada restart).
jwt.secret=${JWT_SECRET:}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Senha do manager 'admin' criado na primeira execução, quando a tabela está vazia
# (ver DataInitializer). Troque em produção.
admin.password=${ADMIN_PASSWORD:admin12345}
